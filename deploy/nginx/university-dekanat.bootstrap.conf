# First stage only: serve ACME challenges before a TLS certificate exists.
# Install as a server block inside nginx's http context, not as nginx.conf.
server {
    listen 80;
    server_name university-dekanat.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Do not expose the login form over HTTP during certificate setup.
    location / {
        default_type text/plain;
        return 503 "HTTPS setup is in progress.\n";
    }
}
