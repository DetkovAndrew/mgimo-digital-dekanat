# Final stage: use only AFTER Certbot has issued the named certificate.
# Next.js production server must listen on 127.0.0.1:3000 on the same host.
# These are server blocks for nginx's http context, not a complete nginx.conf.
server {
    listen 80;
    server_name university-dekanat.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://university-dekanat.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name university-dekanat.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/university-dekanat.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/university-dekanat.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Keep Next.js streaming responses working; do not cache private pages.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
